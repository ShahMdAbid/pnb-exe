name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers when a new version tag is pushed, e.g., v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for electron-builder publish

      - name: Upload Artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: built-app-linux
          path: |
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
